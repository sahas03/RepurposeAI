<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RepurposeAI — computational drug repurposing for rheumatoid arthritis. Disease signature, reversal scoring, safety and novelty screening, gene-level explainability and validation."
    />
    <meta name="theme-color" content="#04090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef3f2" media="(prefers-color-scheme: light)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2304090b'/%3E%3Cpath d='M11 4C11 10 21 10 21 16C21 22 11 22 11 28' stroke='%232de8b0' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M21 4C21 10 11 10 11 16C11 22 21 22 21 28' stroke='%23ff7a45' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>RepurposeAI — Computational Drug Repurposing</title>
    <script>
      // Resolve the theme before first paint so the environment never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('repurposeai.theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          /* private mode: keep the dark default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
